# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET
permissions:
  contents: read
  pull-requests: write
  id-token: write
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check csproj versions are greater than latest tag
        shell: pwsh
        run: ./.github/scripts/check-version.ps1

      # Create
      - name: Provide strong-name key
        env:
          SNK_KEY_BASE64: ${{ secrets.SNK_KEY_BASE64 }}
        run: |
          mkdir C:\temp\ -Force
          [IO.File]::WriteAllBytes("C:\temp\Esox.SharpAndRusty.snk", [Convert]::FromBase64String("$($env:SNK_KEY_BASE64)"))

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Or '9.0.x' if your project targets .NET 9.0

      - name: Build with dotnet
        run: dotnet build --configuration Release -p:ContinuousIntegrationBuild=true
      - name: Restore dependencies
        run: dotnet restore -p:ContinuousIntegrationBuild=true
      - name: Build
        run: dotnet build --no-restore -p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test --no-build --verbosity normal -p:ContinuousIntegrationBuild=true

      - name: Pack NuGet packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet pack Esox.SharpAndRusty\Esox.SharpAndRusty.csproj --configuration Release --no-build --output nupkgs
          dotnet pack Esox.SharpAndRusty.EntityFrameworkCore\Esox.SharpAndRusty.EntityFrameworkCore.csproj --configuration Release --no-build --output nupkgs
          dotnet pack Esox.SharpAndRusty.Analyzers\Esox.SharpAndRusty.Analyzers.csproj --configuration Release --no-build --output nupkgs

      # Trusted Publishing: exchanges the GitHub OIDC token for a short-lived NuGet API key
      - name: NuGet login (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Already-published versions are skipped, so bump <Version> in the csproj to release
      - name: Push to NuGet
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet nuget push "nupkgs\*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
